[project]
name = "doodba-copier-template"
version = "0.1.0"
description = "Copier template to maintain Doodba integration projects"
authors = [{ name = "Jairo Llopis", email = "jairo.llopis@tecnativa.com" }]
requires-python = ">=3.9,<4"
license = "BSL-1.0"
dependencies = ["copier>=9", "plumbum>=1.8.2"]

[dependency-groups]
dev = [
    "invoke>=2.2.1",
    "pylint>=3.2.7",
    "pytest>=8.3.5",
    "pytest-xdist>=3.3.1",
    "requests>=2.32.4",
    "pre-commit>=3.3.3",
    "python-on-whales>=0.81.0",
    "pre-commit-uv>=4.1.5",
]

[tool.pytest]
usefixtures = ["versionless_odoo_autoskip"]
addopts = ["-s", "-ra", "-n", "auto", "--dist", "loadscope"]
markers = [
    "sequential",           # marks tests that cannot run in parallel (deselect with '-m "not sequential"')
    "skip_for_prereleases", # marks tests that will be skipped for prereleases (deselect with '-m "not skip_for_prereleases"')
]
testpaths = ["tests"]

[tool.ruff]
fix = true
target-version = "py39"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "I",  # isort
    "E",
    "F",
]
